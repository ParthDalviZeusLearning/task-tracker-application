<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
       
        <h1>Task Tracker Application</h1>
        <h4>Helps track your day-to-day tasks effciently!</h4>

        <!--Input Section -->
        <div class="input-section">


        <!--Task Input Field -->   
        <input
            type="text"
            id="new-task"
            placeholder="Enter Task "
         >
         <br><br>
        
          <!--Description Input Field -->   
         <input type="text" id="task-description" placeholder="Describe your task">
         <br><br>
        
          <!--Due Date Input-->                            
         <input type="date" id="due-date" min=""">
         <br><br>

         <select id="priority">
            <option value="High" >High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
         </select>
        <br><br>
         <button id="add-btn"> 
                Add Task
        </button>
        
        <br><br>
        <input type="text" id="search-box" placeholder="Search your tasks">

        </div>

        <!--To-Do Task List-->   
        <h2 id="todo-heading">To-Do Tasks </h2>
        <hr>
        <ul id="incomplete-tasks"></ul>

        <!--Completed  Task List-->   
        <h2 id="completed-heading" >Completed Tasks</h2>
        <hr>
        <ul id="completed-tasks"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
